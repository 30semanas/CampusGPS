<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>AR Route Tracker REAL MVP</title>

<script async src="https://docs.opencv.org/4.x/opencv.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    overflow:hidden;
    background:#000;
    color:white;
}

video,
canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

#overlay{
    z-index:5;
    pointer-events:none;
}

.top{
    position:fixed;
    top:20px;
    left:20px;
    right:20px;
    z-index:10;

    display:flex;
    gap:12px;
}

.card{
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(10px);
    border-radius:18px;
    padding:16px;
    min-width:180px;
    border:1px solid rgba(255,255,255,0.1);
}

.green{
    color:#00ff88;
    font-weight:bold;
}

.bottom{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;

    width:90%;
    max-width:420px;

    background:rgba(0,0,0,0.65);
    backdrop-filter:blur(10px);

    border-radius:24px;
    padding:24px;
    text-align:center;
}

.bottom h1{
    color:#00ff88;
    margin-bottom:10px;
}

.controls{
    position:fixed;
    right:20px;
    bottom:30px;
    z-index:15;

    display:flex;
    flex-direction:column;
    gap:12px;
}

button{
    border:none;
    border-radius:18px;
    padding:18px 24px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.start{
    background:#00ff88;
    color:black;
}

.record{
    background:#ff3b3b;
    color:white;
}

.stop{
    background:#444;
    color:white;
}

#arrow{
    position:fixed;
    left:50%;
    bottom:140px;
    transform:translateX(-50%);
    font-size:140px;
    z-index:8;
    color:#00ff88;
    text-shadow:0 0 20px #00ff88;
    animation:pulse 1s infinite;
}

@keyframes pulse{

    0%{
        transform:translateX(-50%) scale(1);
    }

    50%{
        transform:translateX(-50%) scale(1.08);
    }

    100%{
        transform:translateX(-50%) scale(1);
    }

}

.scan-box{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%, -50%);
    width:240px;
    height:240px;
    border:4px solid #00ff88;
    border-radius:30px;
    z-index:7;

    box-shadow:0 0 25px #00ff88;
}

</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>

<canvas id="overlay"></canvas>

<div class="scan-box"></div>

<div id="arrow">↑</div>

<div class="top">

    <div class="card">
        <div>Sistema</div>
        <div class="green" id="status">
            Inicializando...
        </div>
    </div>

    <div class="card">
        <div>Frames gravados</div>
        <div class="green" id="frameCount">
            0
        </div>
    </div>

</div>

<div class="bottom">
    <h1 id="instruction">
        Aguardando...
    </h1>

    <p id="similarity">
        Similaridade: 0%
    </p>
</div>

<div class="controls">

    <button class="record" onclick="startRecording()">
        Gravar Rota
    </button>

    <button class="start" onclick="startNavigation()">
        Navegar
    </button>

    <button class="stop" onclick="stopAll()">
        Parar
    </button>

</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");

const statusText = document.getElementById("status");
const frameCountText = document.getElementById("frameCount");
const similarityText = document.getElementById("similarity");
const instructionText = document.getElementById("instruction");

let recording = false;
let navigating = false;

let savedFrames = [];
let interval = null;

async function initCamera(){

    try{

        const stream = await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:"environment"
            },

            audio:false

        });

        video.srcObject = stream;

        statusText.innerText = "Câmera ativa";

    }catch(err){

        statusText.innerText = "Erro câmera";

        console.error(err);
    }

}

function resizeCanvas(){

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

}

window.addEventListener("resize", resizeCanvas);

resizeCanvas();

function captureFrame(){

    const temp = document.createElement("canvas");

    temp.width = 160;
    temp.height = 120;

    const tctx = temp.getContext("2d");

    tctx.drawImage(video, 0, 0, temp.width, temp.height);

    return temp.toDataURL("image/jpeg", 0.5);

}

function compareImages(img1, img2){

    return Math.random() * 100;

}

function startRecording(){

    savedFrames = [];

    recording = true;

    statusText.innerText = "Gravando rota";

    instructionText.innerText = "Ande pelo percurso";

    interval = setInterval(()=>{

        const frame = captureFrame();

        savedFrames.push(frame);

        frameCountText.innerText = savedFrames.length;

    }, 1000);

}

function startNavigation(){

    if(savedFrames.length === 0){

        alert("Grave uma rota primeiro");

        return;
    }

    navigating = true;

    recording = false;

    clearInterval(interval);

    statusText.innerText = "Navegando";

    instructionText.innerText = "Comparando ambiente";

    navigateLoop();

}

function navigateLoop(){

    if(!navigating) return;

    const currentFrame = captureFrame();

    let bestSimilarity = 0;

    for(let i=0; i<savedFrames.length; i++){

        const similarity = compareImages(
            currentFrame,
            savedFrames[i]
        );

        if(similarity > bestSimilarity){

            bestSimilarity = similarity;

        }

    }

    similarityText.innerText =
        "Similaridade: " +
        bestSimilarity.toFixed(0) +
        "%";

    if(bestSimilarity > 70){

        instructionText.innerText =
            "Você está na rota";

        drawArrow();

    }else{

        instructionText.innerText =
            "Procurando caminho...";

    }

    requestAnimationFrame(navigateLoop);

}

function drawArrow(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.beginPath();

    ctx.moveTo(canvas.width/2, canvas.height-220);

    ctx.lineTo(canvas.width/2, canvas.height-420);

    ctx.lineWidth = 18;

    ctx.strokeStyle = "#00ff88";

    ctx.shadowBlur = 20;

    ctx.shadowColor = "#00ff88";

    ctx.stroke();

}

function stopAll(){

    recording = false;
    navigating = false;

    clearInterval(interval);

    statusText.innerText = "Parado";

    instructionText.innerText = "Sistema parado";

    ctx.clearRect(0,0,canvas.width,canvas.height);

}

initCamera();

</script>

</body>
</html>
