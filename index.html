<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>AR Indoor Navigation</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    overflow:hidden;
    background:black;
}

video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:1;
}

.overlay{
    position:fixed;
    inset:0;
    z-index:5;
    pointer-events:none;
}

.topbar{

    position:absolute;

    top:14px;
    left:14px;
    right:14px;

    display:flex;
    gap:10px;
}

.card{

    flex:1;

    background:rgba(0,0,0,0.45);

    backdrop-filter:blur(10px);

    border-radius:20px;

    border:1px solid rgba(255,255,255,0.08);

    padding:14px;

    color:white;
}

.label{

    font-size:12px;

    opacity:0.7;
}

.value{

    margin-top:6px;

    font-size:20px;

    color:#00ff9d;

    font-weight:bold;

    text-shadow:0 0 10px #00ff9d;
}

.center-guide{

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    display:flex;

    flex-direction:column;

    align-items:center;
}

.path{

    display:flex;

    flex-direction:column;

    gap:10px;

    align-items:center;
}

.chevron{

    width:60px;
    height:60px;

    border-left:5px solid #5fffd2;
    border-top:5px solid #5fffd2;

    transform:rotate(45deg);

    filter:
    drop-shadow(0 0 8px #5fffd2)
    drop-shadow(0 0 16px #5fffd2);

    animation:flow 1.2s infinite;
}

.chevron:nth-child(2){

    transform:rotate(45deg) scale(0.8);
    opacity:0.7;
}

.chevron:nth-child(3){

    transform:rotate(45deg) scale(0.6);
    opacity:0.5;
}

@keyframes flow{

    0%{
        opacity:0.2;
        transform:rotate(45deg) translateY(0);
    }

    50%{
        opacity:1;
        transform:rotate(45deg) translateY(-6px);
    }

    100%{
        opacity:0.2;
        transform:rotate(45deg) translateY(0);
    }

}

.align-box{

    margin-top:20px;

    background:rgba(0,0,0,0.5);

    padding:16px 20px;

    border-radius:18px;

    border:1px solid rgba(0,255,180,0.3);

    color:white;

    text-align:center;

    min-width:240px;

    backdrop-filter:blur(8px);
}

.align-box h2{

    font-size:22px;

    margin-bottom:6px;

    color:#00ff9d;
}

.align-box p{

    font-size:15px;

    opacity:0.85;
}

.bottom{

    position:absolute;

    left:50%;

    transform:translateX(-50%);

    bottom:110px;

    width:88%;

    background:rgba(0,0,0,0.5);

    border-radius:24px;

    backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,0.08);

    padding:18px;

    text-align:center;

    color:white;
}

.bottom h1{

    font-size:28px;

    margin-bottom:8px;
}

.bottom p{

    font-size:16px;

    opacity:0.9;
}

.highlight{

    color:#ffd84d;
}

.green{

    color:#00ff9d;
}

.controls{

    position:absolute;

    bottom:18px;

    left:50%;

    transform:translateX(-50%);

    display:flex;

    gap:10px;

    z-index:20;

    pointer-events:auto;
}

button{

    border:none;

    border-radius:999px;

    padding:14px 18px;

    font-size:15px;

    font-weight:bold;

    color:white;

    cursor:pointer;
}

.stop{

    background:#ff4040;
}

.record{

    background:#1b1b1b;
}

.start{

    background:#00ff9d;
    color:black;
}

.radar{

    position:absolute;

    right:16px;
    top:130px;

    width:90px;
    height:90px;

    border-radius:50%;

    border:2px solid rgba(0,255,180,0.4);

    overflow:hidden;

    box-shadow:0 0 20px rgba(0,255,180,0.3);
}

.scan{

    position:absolute;

    width:50%;
    height:2px;

    background:#00ff9d;

    top:50%;
    left:50%;

    transform-origin:left center;

    animation:radar 2s linear infinite;

    box-shadow:0 0 10px #00ff9d;
}

@keyframes radar{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

.status-dot{

    display:inline-block;

    width:10px;
    height:10px;

    border-radius:50%;

    background:#00ff9d;

    margin-right:6px;

    box-shadow:0 0 10px #00ff9d;
}

</style>

</head>

<body>

<video
id="video"
autoplay
playsinline
muted>
</video>

<div class="overlay">

    <div class="topbar">

        <div class="card">

            <div class="label">
                SISTEMA
            </div>

            <div class="value">
                <span class="status-dot"></span>
                AR ATIVO
            </div>

        </div>

        <div class="card">

            <div class="label">
                CHECKPOINT
            </div>

            <div
            class="value"
            id="checkpoint">

                0 / 12

            </div>

        </div>

    </div>

    <div class="radar">

        <div class="scan"></div>

    </div>

    <div class="center-guide">

        <div class="path">

            <div class="chevron"></div>
            <div class="chevron"></div>
            <div class="chevron"></div>

        </div>

        <div class="align-box">

            <h2 id="guideTitle">
                Siga em frente
            </h2>

            <p id="guideText">
                Ambiente alinhado
            </p>

        </div>

    </div>

    <div class="bottom">

        <h1 id="mainDirection">

            Ajuste para a
            <span class="highlight">
                direita
            </span>

        </h1>

        <p>

            Depois siga em
            <span class="green">
                frente
            </span>

        </p>

    </div>

    <div class="controls">

        <button
        class="stop"
        onclick="stopAR()">

            Parar

        </button>

        <button
        class="record"
        onclick="recordRoute()">

            Gravar

        </button>

        <button
        class="start"
        onclick="startNavigation()">

            Navegar

        </button>

    </div>

</div>

<script>

const video =
document.getElementById("video");

const guideTitle =
document.getElementById("guideTitle");

const guideText =
document.getElementById("guideText");

const mainDirection =
document.getElementById("mainDirection");

const checkpoint =
document.getElementById("checkpoint");

let route = [];

let current = 0;

async function startCamera(){

    try{

        const stream =
        await navigator
        .mediaDevices
        .getUserMedia({

            video:{
                facingMode:"environment"
            },

            audio:false

        });

        video.srcObject = stream;

    }

    catch(e){

        alert(
            "Erro ao acessar câmera"
        );

    }

}

function recordRoute(){

    route = [];

    current = 0;

    guideTitle.innerText =
    "Gravando rota";

    guideText.innerText =
    "Ande lentamente";

    let interval =
    setInterval(()=>{

        if(route.length >= 12){

            clearInterval(interval);

            guideTitle.innerText =
            "Rota salva";

            guideText.innerText =
            "12 checkpoints";

            return;
        }

        route.push({

            id:route.length

        });

        checkpoint.innerText =
        route.length + " / 12";

    },1500);

}

function startNavigation(){

    if(route.length === 0){

        alert(
        "Grave uma rota primeiro"
        );

        return;
    }

    simulateNavigation();

}

function simulateNavigation(){

    let steps = [

        {
            title:"Siga em frente",
            text:"Ambiente alinhado"
        },

        {
            title:"Ajuste para direita",
            text:"Você desviou levemente"
        },

        {
            title:"Volte um pouco",
            text:"Você saiu da rota"
        },

        {
            title:"Correto",
            text:"Tracking estabilizado"
        },

        {
            title:"Destino alcançado",
            text:"Você chegou"
        }

    ];

    let i = 0;

    let loop =
    setInterval(()=>{

        if(i >= steps.length){

            clearInterval(loop);
            return;
        }

        guideTitle.innerText =
        steps[i].title;

        guideText.innerText =
        steps[i].text;

        mainDirection.innerHTML =
        steps[i].title;

        checkpoint.innerText =
        (i+1) + " / 12";

        i++;

    },3000);

}

function stopAR(){

    guideTitle.innerText =
    "Sistema parado";

    guideText.innerText =
    "";

}

startCamera();

</script>

</body>
</html>
