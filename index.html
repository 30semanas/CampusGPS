<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AR Route Guide</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#0f0f0f;
      color:white;
      overflow:hidden;
    }

    #camera{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      object-fit:cover;
      z-index:1;
    }

    .overlay{
      position:fixed;
      inset:0;
      z-index:2;
      pointer-events:none;
    }

    .topbar{
      position:absolute;
      top:20px;
      left:20px;
      right:20px;

      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .badge{
      background:rgba(0,0,0,0.6);
      padding:12px 18px;
      border-radius:12px;
      backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,0.1);
    }

    .status{
      color:#00ff88;
      font-weight:bold;
    }

    .ar-arrow{
      position:absolute;
      bottom:120px;
      left:50%;
      transform:translateX(-50%);
      font-size:120px;
      animation:pulse 1s infinite;
      text-shadow:0 0 20px #00ff88;
      color:#00ff88;
    }

    .route-line{
      position:absolute;
      bottom:0;
      left:50%;
      width:12px;
      height:55%;
      background:linear-gradient(
        to top,
        rgba(0,255,136,1),
        rgba(0,255,136,0)
      );

      transform:translateX(-50%);
      border-radius:20px;
      box-shadow:0 0 20px #00ff88;
    }

    .instructions{
      position:absolute;
      bottom:30px;
      left:50%;
      transform:translateX(-50%);

      background:rgba(0,0,0,0.7);
      padding:18px 24px;
      border-radius:16px;
      text-align:center;
      min-width:300px;

      border:1px solid rgba(255,255,255,0.1);
      backdrop-filter:blur(10px);
    }

    .instructions h2{
      margin-bottom:8px;
      color:#00ff88;
    }

    .scan-box{
      position:absolute;
      top:50%;
      left:50%;
      width:240px;
      height:240px;
      transform:translate(-50%, -50%);
      border:3px solid #00ff88;
      border-radius:20px;
      box-shadow:0 0 25px #00ff88;
      animation:scan 2s infinite linear;
    }

    @keyframes pulse{
      0%{
        transform:translateX(-50%) scale(1);
      }

      50%{
        transform:translateX(-50%) scale(1.1);
      }

      100%{
        transform:translateX(-50%) scale(1);
      }
    }

    @keyframes scan{
      0%{
        opacity:0.4;
      }

      50%{
        opacity:1;
      }

      100%{
        opacity:0.4;
      }
    }

    .controls{
      position:fixed;
      right:20px;
      bottom:20px;
      z-index:3;

      display:flex;
      flex-direction:column;
      gap:12px;
    }

    button{
      border:none;
      padding:16px 22px;
      border-radius:14px;
      font-size:16px;
      cursor:pointer;
      font-weight:bold;
      transition:0.3s;
    }

    .start{
      background:#00ff88;
      color:black;
    }

    .record{
      background:#ff3b3b;
      color:white;
    }

    button:hover{
      transform:scale(1.05);
    }

  </style>
</head>

<body>

  <video id="camera" autoplay playsinline muted></video>

  <div class="overlay">

    <div class="topbar">

      <div class="badge">
        <div>Sistema:</div>
        <div class="status">AR Tracking Ativo</div>
      </div>

      <div class="badge">
        <div>Rota:</div>
        <div>Corredor Principal → Sala 03</div>
      </div>

    </div>

    <div class="scan-box"></div>

    <div class="route-line"></div>

    <div class="ar-arrow">
      ↑
    </div>

    <div class="instructions">
      <h2>Siga em frente</h2>
      <p>Reconhecendo ambiente...</p>
    </div>

  </div>

  <div class="controls">
    <button class="start" onclick="startAR()">
      Iniciar AR
    </button>

    <button class="record" onclick="recordRoute()">
      Gravar Rota
    </button>
  </div>

  <script>

    const video = document.getElementById("camera");

    async function startCamera(){

      try{

        const stream = await navigator.mediaDevices.getUserMedia({
          video:{
            facingMode:"environment"
          },
          audio:false
        });

        video.srcObject = stream;

      }catch(error){

        alert("Erro ao acessar câmera");

        console.error(error);
      }
    }

    function startAR(){

      alert(
        "Modo AR iniciado.\n\n" +
        "Aqui entraria:\n" +
        "- OpenCV\n" +
        "- SLAM\n" +
        "- Reconhecimento de ambiente\n" +
        "- Tracking visual\n" +
        "- Navegação AR"
      );

    }

    function recordRoute(){

      alert(
        "Gravando rota...\n\n" +
        "O sistema salvaria:\n" +
        "- Frames-chave\n" +
        "- Pontos visuais\n" +
        "- Direção\n" +
        "- Posição relativa"
      );

    }

    startCamera();

  </script>

</body>
</html>
