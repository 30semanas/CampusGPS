<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AR Indoor Navigation</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial;
}

video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

.overlay{
    position:fixed;
    inset:0;
    z-index:5;
    pointer-events:none;
}

.top{
    position:absolute;
    top:20px;
    left:20px;
    right:20px;
    display:flex;
    gap:10px;
}

.card{
    background:rgba(0,0,0,0.6);
    color:white;
    padding:15px;
    border-radius:18px;
    min-width:160px;
}

.green{
    color:#00ff88;
    font-weight:bold;
}

.bottom{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    bottom:40px;
    width:85%;
    max-width:420px;

    background:rgba(0,0,0,0.6);
    border-radius:24px;
    padding:24px;
    text-align:center;
    color:white;
}

.bottom h1{
    color:#00ff88;
}

.arrow{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%, -50%);
    font-size:180px;
    color:#00ff88;
    text-shadow:0 0 20px #00ff88;
}

.controls{
    position:fixed;
    right:20px;
    bottom:20px;
    display:flex;
    flex-direction:column;
    gap:12px;
    z-index:10;
}

button{
    border:none;
    padding:18px;
    border-radius:18px;
    font-size:18px;
    font-weight:bold;
}

.record{
    background:#ff3131;
    color:white;
}

.navigate{
    background:#00ff88;
}

.stop{
    background:#444;
    color:white;
}

</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>

<div class="overlay">

    <div class="top">

        <div class="card">
            <div>Sistema</div>
            <div class="green" id="status">
                Iniciando...
            </div>
        </div>

        <div class="card">
            <div>Checkpoint</div>
            <div class="green" id="checkpoint">
                0
            </div>
        </div>

    </div>

    <div class="arrow" id="arrow">
        ↑
    </div>

    <div class="bottom">

        <h1 id="instruction">
            Aguardando
        </h1>

        <p id="details">
            Grave uma rota primeiro
        </p>

    </div>

</div>

<div class="controls">

    <button class="record" onclick="recordRoute()">
        Gravar
    </button>

    <button class="navigate" onclick="startNavigation()">
        Navegar
    </button>

    <button class="stop" onclick="stopAll()">
        Parar
    </button>

</div>

<script>

const video = document.getElementById("video");

const statusEl = document.getElementById("status");
const instructionEl = document.getElementById("instruction");
const detailsEl = document.getElementById("details");
const checkpointEl = document.getElementById("checkpoint");
const arrowEl = document.getElementById("arrow");

let checkpoints = [];

let recording = false;
let navigating = false;

let currentCheckpoint = 0;

async function initCamera(){

    try{

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"environment"
                },

                audio:false

            });

        video.srcObject = stream;

        statusEl.innerText = "Câmera ativa";

    }catch(err){

        alert("Erro câmera");

    }

}

function captureFrame(){

    const canvas = document.createElement("canvas");

    canvas.width = 160;
    canvas.height = 120;

    const ctx = canvas.getContext("2d");

    ctx.drawImage(video,0,0,160,120);

    return canvas.toDataURL("image/jpeg",0.4);

}

function recordRoute(){

    checkpoints = [];

    currentCheckpoint = 0;

    recording = true;

    statusEl.innerText = "Gravando";

    instructionEl.innerText = "Ande lentamente";

    detailsEl.innerText =
        "Checkpoint salvo a cada 2 segundos";

    const recordLoop = setInterval(()=>{

        if(!recording){

            clearInterval(recordLoop);
            return;

        }

        const frame = captureFrame();

        checkpoints.push(frame);

        checkpointEl.innerText =
            checkpoints.length;

    },2000);

}

function startNavigation(){

    if(checkpoints.length === 0){

        alert("Grave uma rota antes");

        return;

    }

    navigating = true;

    recording = false;

    statusEl.innerText = "Navegando";

    instructionEl.innerText =
        "Siga em frente";

    detailsEl.innerText =
        "Procurando checkpoint";

    navigationLoop();

}

function fakeSimilarity(){

    return Math.random() * 100;

}

function navigationLoop(){

    if(!navigating) return;

    const similarity = fakeSimilarity();

    if(similarity > 75){

        currentCheckpoint++;

        checkpointEl.innerText =
            currentCheckpoint + "/" +
            checkpoints.length;

        instructionEl.innerText =
            "Checkpoint encontrado";

        detailsEl.innerText =
            "Continue andando";

        arrowEl.innerHTML = "↑";

    }

    else if(similarity > 45){

        instructionEl.innerText =
            "Você está próximo";

        detailsEl.innerText =
            "Ajuste a câmera";

    }

    else{

        instructionEl.innerText =
            "Você saiu da rota";

        detailsEl.innerText =
            "Volte para o último ponto";

        arrowEl.innerHTML = "↺";

    }

    if(currentCheckpoint >= checkpoints.length){

        instructionEl.innerText =
            "Destino alcançado";

        detailsEl.innerText =
            "Você chegou";

        arrowEl.innerHTML = "✓";

        navigating = false;

        return;

    }

    setTimeout(navigationLoop,1500);

}

function stopAll(){

    recording = false;
    navigating = false;

    statusEl.innerText = "Parado";

    instructionEl.innerText = "Sistema parado";

    detailsEl.innerText = "";

}

initCamera();

</script>

</body>
</html>
