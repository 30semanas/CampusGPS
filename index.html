<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="
width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>Advanced AR Indoor Navigation</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    overflow:hidden;
    background:black;
}

video{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:1;
}

.overlay{

    position:fixed;

    inset:0;

    z-index:5;

    pointer-events:none;
}

.topbar{

    position:absolute;

    top:12px;
    left:12px;
    right:12px;

    display:flex;

    gap:10px;
}

.card{

    flex:1;

    background:rgba(0,0,0,0.45);

    border:1px solid rgba(255,255,255,0.08);

    border-radius:18px;

    backdrop-filter:blur(10px);

    padding:14px;

    color:white;
}

.label{

    font-size:11px;

    opacity:0.7;
}

.value{

    margin-top:6px;

    font-size:18px;

    font-weight:bold;

    color:#00ff9d;

    text-shadow:0 0 10px #00ff9d;
}

.status-dot{

    display:inline-block;

    width:10px;
    height:10px;

    border-radius:50%;

    background:#00ff9d;

    margin-right:6px;

    box-shadow:0 0 10px #00ff9d;
}

.radar{

    position:absolute;

    top:110px;
    right:14px;

    width:82px;
    height:82px;

    border-radius:50%;

    overflow:hidden;

    border:2px solid rgba(0,255,180,0.35);

    background:rgba(0,0,0,0.3);

    box-shadow:0 0 18px rgba(0,255,180,0.3);
}

.scan{

    position:absolute;

    width:50%;
    height:2px;

    background:#00ff9d;

    top:50%;
    left:50%;

    transform-origin:left center;

    animation:radar 2s linear infinite;

    box-shadow:0 0 10px #00ff9d;
}

@keyframes radar{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

.center-guide{

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    display:flex;

    flex-direction:column;

    align-items:center;
}

.path{

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:12px;
}

.chevron{

    width:60px;
    height:60px;

    border-left:5px solid #5fffd2;
    border-top:5px solid #5fffd2;

    transform:rotate(45deg);

    filter:
    drop-shadow(0 0 8px #5fffd2)
    drop-shadow(0 0 16px #5fffd2);

    animation:flow 1.2s infinite;
}

.chevron:nth-child(2){

    transform:rotate(45deg) scale(0.8);

    opacity:0.7;
}

.chevron:nth-child(3){

    transform:rotate(45deg) scale(0.6);

    opacity:0.4;
}

@keyframes flow{

    0%{
        opacity:0.2;
        transform:rotate(45deg) translateY(0);
    }

    50%{
        opacity:1;
        transform:rotate(45deg) translateY(-7px);
    }

    100%{
        opacity:0.2;
        transform:rotate(45deg) translateY(0);
    }

}

.align-box{

    margin-top:22px;

    min-width:250px;

    padding:16px 20px;

    background:rgba(0,0,0,0.48);

    border-radius:18px;

    border:1px solid rgba(0,255,180,0.28);

    backdrop-filter:blur(10px);

    text-align:center;

    color:white;
}

.align-title{

    color:#00ff9d;

    font-size:20px;

    margin-bottom:6px;
}

.align-text{

    font-size:14px;

    opacity:0.85;
}

.bottom{

    position:absolute;

    left:50%;

    transform:translateX(-50%);

    bottom:100px;

    width:90%;

    max-width:420px;

    background:rgba(0,0,0,0.48);

    border:1px solid rgba(255,255,255,0.08);

    border-radius:24px;

    backdrop-filter:blur(12px);

    padding:18px;

    text-align:center;

    color:white;
}

.bottom h1{

    font-size:28px;

    line-height:1.2;

    margin-bottom:8px;
}

.bottom p{

    font-size:15px;

    opacity:0.85;
}

.highlight{

    color:#ffd84d;
}

.green{

    color:#00ff9d;
}

.controls{

    position:absolute;

    bottom:18px;

    left:50%;

    transform:translateX(-50%);

    display:flex;

    gap:10px;

    z-index:20;

    pointer-events:auto;
}

button{

    border:none;

    border-radius:999px;

    padding:14px 18px;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    color:white;

    min-width:100px;
}

.stop{

    background:#ff4040;
}

.record{

    background:#1e1e1e;
}

.start{

    background:#00ff9d;

    color:black;
}

</style>

</head>

<body>

<video
id="video"
autoplay
playsinline
muted>
</video>

<div class="overlay">

    <div class="topbar">

        <div class="card">

            <div class="label">
                SISTEMA
            </div>

            <div class="value">

                <span class="status-dot"></span>

                AR ATIVO

            </div>

        </div>

        <div class="card">

            <div class="label">
                CHECKPOINTS
            </div>

            <div
            class="value"
            id="checkpoint">

                0 pontos

            </div>

        </div>

    </div>

    <div class="radar">

        <div class="scan"></div>

    </div>

    <div class="center-guide">

        <div class="path">

            <div class="chevron"></div>
            <div class="chevron"></div>
            <div class="chevron"></div>

        </div>

        <div class="align-box">

            <div class="align-title">

                TRACKING

            </div>

            <div
            class="align-text"
            id="trackingText">

                Sistema aguardando

            </div>

        </div>

    </div>

    <div class="bottom">

        <h1
        id="directionText">

            Siga em
            <span class="green">
                frente
            </span>

        </h1>

        <p
        id="subDirection">

            Navegação estabilizada

        </p>

    </div>

    <div class="controls">

        <button
        class="stop"
        onclick="stopAR()">

            Parar

        </button>

        <button
        class="record"
        onclick="recordRoute()">

            Gravar

        </button>

        <button
        class="start"
        onclick="startNavigation()">

            Navegar

        </button>

    </div>

</div>

<script>

const video =
document.getElementById("video");

const trackingText =
document.getElementById("trackingText");

const directionText =
document.getElementById("directionText");

const subDirection =
document.getElementById("subDirection");

const checkpoint =
document.getElementById("checkpoint");

let route = [];

let recording = false;

let navigating = false;

let routeRecorder = null;

let navigationLoop = null;

let currentCheckpoint = 0;

async function startCamera(){

    try{

        const stream =
        await navigator
        .mediaDevices
        .getUserMedia({

            video:{
                facingMode:"environment"
            },

            audio:false

        });

        video.srcObject = stream;

    }

    catch(err){

        alert(
            "Erro ao acessar câmera"
        );

    }

}

function recordRoute(){

    clearInterval(routeRecorder);

    clearInterval(navigationLoop);

    route = [];

    recording = true;

    navigating = false;

    currentCheckpoint = 0;

    trackingText.innerText =
    "Capturando ambiente";

    directionText.innerHTML =
    "Gravando rota";

    subDirection.innerText =
    "Ande lentamente";

    routeRecorder =
    setInterval(()=>{

        if(!recording){

            clearInterval(routeRecorder);
            return;
        }

        const checkpointData = {

            id:route.length + 1,

            timestamp:Date.now()

        };

        route.push(checkpointData);

        checkpoint.innerText =
        route.length + " pontos";

        trackingText.innerText =

        "Checkpoint " +
        route.length +
        " salvo";

    },1500);

}

function startNavigation(){

    if(route.length === 0){

        alert(
        "Grave uma rota primeiro"
        );

        return;
    }

    clearInterval(navigationLoop);

    recording = false;

    navigating = true;

    currentCheckpoint = 0;

    trackingText.innerText =
    "Analisando ambiente";

    subDirection.innerText =
    "Navegação iniciada";

    navigationLoop =
    setInterval(()=>{

        if(!navigating){

            clearInterval(
            navigationLoop
            );

            return;
        }

        if(
        currentCheckpoint >=
        route.length
        ){

            clearInterval(
            navigationLoop
            );

            trackingText.innerText =
            "Destino alcançado";

            directionText.innerHTML =
            "✓ Você chegou";

            subDirection.innerText =
            "Rota concluída";

            navigating = false;

            return;
        }

        const random =
        Math.random();

        let direction = "frente";

        if(random < 0.25){

            direction = "esquerda";

        }

        else if(random < 0.5){

            direction = "direita";

        }

        else{

            direction = "frente";

        }

        if(direction === "frente"){

            directionText.innerHTML =

            `Siga em
            <span class="green">
            frente
            </span>`;

            trackingText.innerText =
            "Ambiente alinhado";

            subDirection.innerText =
            "Continue andando";

        }

        if(direction === "direita"){

            directionText.innerHTML =

            `Ajuste para
            <span class="highlight">
            direita
            </span>`;

            trackingText.innerText =
            "Desvio detectado";

            subDirection.innerText =
            "Corrija suavemente";

        }

        if(direction === "esquerda"){

            directionText.innerHTML =

            `Ajuste para
            <span class="highlight">
            esquerda
            </span>`;

            trackingText.innerText =
            "Leve desalinhamento";

            subDirection.innerText =
            "Movimente lentamente";

        }

        currentCheckpoint++;

        checkpoint.innerText =

        currentCheckpoint +
        " / " +
        route.length;

    },3500);

}

function stopAR(){

    recording = false;

    navigating = false;

    clearInterval(routeRecorder);

    clearInterval(navigationLoop);

    trackingText.innerText =
    "Sistema pausado";

    directionText.innerHTML =
    "AR parado";

    subDirection.innerText =

    route.length +
    " checkpoints salvos";

}

startCamera();

</script>

</body>
</html>
