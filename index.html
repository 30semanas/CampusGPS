<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ORB Indoor Navigation</title>

<script async src="https://docs.opencv.org/4.x/opencv.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    overflow:hidden;
    background:black;
}

video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:1;
}

canvas{
    position:fixed;
    inset:0;
    z-index:2;
}

.ui{
    position:fixed;
    inset:0;
    z-index:5;
    pointer-events:none;
}

.top{
    position:absolute;
    top:20px;
    left:20px;
    right:20px;
    display:flex;
    gap:12px;
}

.card{
    background:rgba(0,0,0,0.65);
    color:white;
    padding:16px;
    border-radius:20px;
    backdrop-filter:blur(10px);
    min-width:180px;
}

.green{
    color:#00ff88;
    font-weight:bold;
}

.bottom{
    position:absolute;
    bottom:35px;
    left:50%;
    transform:translateX(-50%);
    width:90%;
    max-width:420px;

    background:rgba(0,0,0,0.65);
    color:white;
    padding:24px;
    border-radius:24px;
    text-align:center;
}

.bottom h1{
    color:#00ff88;
    margin-bottom:10px;
}

.arrow{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%, -50%);
    font-size:180px;
    color:#00ff88;
    text-shadow:0 0 30px #00ff88;
}

.controls{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:20;

    display:flex;
    flex-direction:column;
    gap:12px;
}

button{
    border:none;
    border-radius:18px;
    padding:18px 24px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    pointer-events:auto;
}

.record{
    background:#ff3131;
    color:white;
}

.navigate{
    background:#00ff88;
}

.stop{
    background:#444;
    color:white;
}

</style>

</head>

<body>

<video id="video" autoplay playsinline muted></video>

<canvas id="canvas"></canvas>

<div class="ui">

    <div class="top">

        <div class="card">
            <div>Status</div>
            <div class="green" id="status">
                Inicializando...
            </div>
        </div>

        <div class="card">
            <div>Checkpoint</div>
            <div class="green" id="checkpoint">
                0
            </div>
        </div>

        <div class="card">
            <div>Matches</div>
            <div class="green" id="matches">
                0
            </div>
        </div>

    </div>

    <div class="arrow" id="arrow">
        ↑
    </div>

    <div class="bottom">

        <h1 id="instruction">
            Aguardando...
        </h1>

        <p id="details">
            Grave uma rota
        </p>

    </div>

</div>

<div class="controls">

    <button class="record" onclick="startRecording()">
        Gravar
    </button>

    <button class="navigate" onclick="startNavigation()">
        Navegar
    </button>

    <button class="stop" onclick="stopAll()">
        Parar
    </button>

</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const statusEl = document.getElementById("status");
const checkpointEl = document.getElementById("checkpoint");
const matchesEl = document.getElementById("matches");
const instructionEl = document.getElementById("instruction");
const detailsEl = document.getElementById("details");
const arrowEl = document.getElementById("arrow");

let checkpoints = [];

let recording = false;
let navigating = false;

let currentCheckpoint = 0;

let orb;
let bf;

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

async function init(){

    const stream =
        await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:"environment"
            },

            audio:false

        });

    video.srcObject = stream;

    statusEl.innerText = "Câmera ativa";

}

function waitOpenCV(){

    if(typeof cv === "undefined"){

        setTimeout(waitOpenCV,500);
        return;
    }

    orb = new cv.ORB();

    bf = new cv.BFMatcher(cv.NORM_HAMMING, true);

    statusEl.innerText = "OpenCV pronto";

}

function captureMat(){

    const temp = document.createElement("canvas");

    temp.width = 320;
    temp.height = 240;

    const tctx = temp.getContext("2d");

    tctx.drawImage(video,0,0,320,240);

    return cv.imread(temp);

}

function extractFeatures(mat){

    const gray = new cv.Mat();

    cv.cvtColor(mat, gray, cv.COLOR_RGBA2GRAY);

    const keypoints = new cv.KeyPointVector();

    const descriptors = new cv.Mat();

    orb.detectAndCompute(
        gray,
        new cv.Mat(),
        keypoints,
        descriptors
    );

    gray.delete();

    return {
        keypoints,
        descriptors
    };

}

function startRecording(){

    checkpoints = [];

    currentCheckpoint = 0;

    recording = true;

    statusEl.innerText = "Gravando";

    instructionEl.innerText =
        "Ande lentamente";

    detailsEl.innerText =
        "Capturando pontos únicos";

    const loop = setInterval(()=>{

        if(!recording){

            clearInterval(loop);
            return;
        }

        const frame = captureMat();

        const features =
            extractFeatures(frame);

        checkpoints.push(features);

        checkpointEl.innerText =
            checkpoints.length;

        frame.delete();

    },2000);

}

function compareDescriptors(desc1, desc2){

    if(
        desc1.empty() ||
        desc2.empty()
    ){
        return 0;
    }

    const matches = new cv.DMatchVector();

    bf.match(desc1, desc2, matches);

    let good = 0;

    for(let i=0; i<matches.size(); i++){

        const m = matches.get(i);

        if(m.distance < 40){

            good++;

        }

    }

    matches.delete();

    return good;

}

function startNavigation(){

    if(checkpoints.length === 0){

        alert("Grave uma rota primeiro");
        return;
    }

    recording = false;
    navigating = true;

    statusEl.innerText = "Navegando";

    instructionEl.innerText =
        "Analisando ambiente";

    navigationLoop();

}

function navigationLoop(){

    if(!navigating) return;

    const currentFrame = captureMat();

    const currentFeatures =
        extractFeatures(currentFrame);

    let bestMatch = 0;
    let bestIndex = 0;

    for(let i=0; i<checkpoints.length; i++){

        const score =
            compareDescriptors(

                currentFeatures.descriptors,
                checkpoints[i].descriptors

            );

        if(score > bestMatch){

            bestMatch = score;
            bestIndex = i;

        }

    }

    matchesEl.innerText = bestMatch;

    checkpointEl.innerText =
        bestIndex + "/" +
        checkpoints.length;

    if(bestMatch > 80){

        instructionEl.innerText =
            "Você está na rota";

        detailsEl.innerText =
            "Continue andando";

        arrowEl.innerHTML = "↑";

    }

    else if(bestMatch > 40){

        instructionEl.innerText =
            "Quase alinhado";

        detailsEl.innerText =
            "Ajuste a câmera";

        arrowEl.innerHTML = "↻";

    }

    else{

        instructionEl.innerText =
            "Você saiu da rota";

        detailsEl.innerText =
            "Retorne ao último ponto";

        arrowEl.innerHTML = "↺";

    }

    if(bestIndex >= checkpoints.length - 1
       && bestMatch > 80){

        instructionEl.innerText =
            "Destino alcançado";

        detailsEl.innerText =
            "Você chegou";

        arrowEl.innerHTML = "✓";

        navigating = false;

    }

    drawDebug(bestMatch);

    currentFrame.delete();

    requestAnimationFrame(navigationLoop);

}

function drawDebug(score){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.strokeStyle = "#00ff88";

    ctx.lineWidth = 10;

    ctx.shadowBlur = 20;

    ctx.shadowColor = "#00ff88";

    ctx.strokeRect(
        canvas.width/2 - 120,
        canvas.height/2 - 120,
        240,
        240
    );

    ctx.font = "30px Arial";

    ctx.fillStyle = "#00ff88";

    ctx.fillText(
        "Score: " + score,
        40,
        canvas.height - 40
    );

}

function stopAll(){

    recording = false;
    navigating = false;

    statusEl.innerText = "Parado";

    instructionEl.innerText =
        "Sistema parado";

    detailsEl.innerText = "";

}

init();
waitOpenCV();

</script>

</body>
</html>
